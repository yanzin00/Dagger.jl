name: CI

on:
  push:
    branches:
      - yg/mpi-ci-test
    tags:
      - '*'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Julia 1 - ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'

      - uses: julia-actions/cache@v2

      - uses: julia-actions/julia-buildpkg@v1

      - name: Configure MPI
        # MPIPreferences requires a Julia restart to pick up binary changes.
        # We configure it here in a separate step so that the main test process
        # starts with the correct library already selected.
        run: julia --project=test -e 'using Pkg; Pkg.instantiate(); using MPIPreferences; MPIPreferences.use_jll_binary("MPICH_jll"; export_prefs=true)'
        if: env.CI_USE_MPI == '1'
        env:
          CI_USE_MPI: "1"

      - name: Run tests
        uses: julia-actions/julia-runtest@v1
        env:
          JULIA_NUM_THREADS: 2
          CI_USE_MPI: "1"
        with:
          annotate: true
